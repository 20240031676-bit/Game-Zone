<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameFinder - Video Game Search</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>🎮 GameFinder</h1>
            <p>Discover your next favorite video game</p>
        </div>
    </header>

    <main class="container">
        <section class="search-section">
            <h2>Find a Game</h2>
            <form id="searchForm">
                <div class="search-box">
                    <input type="text" id="searchInput"
                           placeholder="Search for a game..."
                           autocomplete="off" required>
                    <button type="submit">Search</button>
                </div>
            </form>
        </section>

        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Searching for games...</p>
        </div>

        <div id="error" class="error hidden"></div>

        <section>
            <div class="results-header">
                <h2 id="resultsTitle">Popular Games</h2>
                <span id="resultCount"></span>
            </div>
            <div id="gamesContainer" class="games-grid"></div>
        </section>
    </main>

    <footer>
        <p>GameFinder &copy; 2026</p>
        <p>Powered by IGDB</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
