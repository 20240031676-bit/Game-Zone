<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameFinder - Video Game Search</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" href="gamezone-logo.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="sidebar" id="sidebar" aria-label="Sections">
    <button class="nav-icon active" data-view="home" title="Home" aria-label="Home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9"/></svg>
    </button>
    <button class="nav-icon" data-view="genres" title="Genres" aria-label="Genres">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>
    </button>
    <button class="nav-icon" data-view="recent" title="Recent searches" aria-label="Recent searches">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
    </button>
    <button class="nav-icon" data-view="favorites" title="Favorites" aria-label="Favorites">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20s-7.5-4.6-9.7-9A5.4 5.4 0 0 1 12 6a5.4 5.4 0 0 1 9.7 5c-2.2 4.4-9.7 9-9.7 9Z"/></svg>
    </button>
    <button class="nav-icon" data-view="history" title="Recently clicked" aria-label="Recently clicked">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 4h6l1 3h3.5a1 1 0 0 1 1 1v10.5a1 1 0 0 1-1 1H4.5a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1H8l1-3Z"/><circle cx="12" cy="13" r="3.2"/></svg>
    </button>
  </nav>

  <div class="page">
 <header>
  <div class="container header-inner">
    <img src="gamezone-logo.svg" alt="Game Zone logo">
    <div class="header-text">
      <h1>Game Zone</h1>
      <p>Discover your next favorite video game</p>
    </div>
  </div>
</header>

    <main class="container">
      <section class="search-section" id="searchSection">
        <h2>Find a Game</h2>
        <form id="searchForm">
          <div class="search-box">
            <input id="searchInput" type="text" placeholder="Search for a game..." required>
            <button type="submit">Search</button>
          </div>
        </form>
      </section>
      <!-- Add this inside public/index.html where you want the controls to appear -->
<div class="controls-bar flex gap-4 my-4">
  <!-- Sort Dropdown -->
  <select id="sortSelect" class="bg-slate-800 text-white p-2 rounded">
    <option value="">Sort By</option>
    <option value="rating-desc">Highest Rated</option>
    <option value="rating-asc">Lowest Rated</option>
    <option value="year-desc">Release Year</option>
    <option value="title-asc">Title (A-Z)</option>
  </select>

  <!-- Platform Filter -->
  <select id="platformFilter" class="bg-slate-800 text-white p-2 rounded">
    <option value="all">All Platforms</option>
    <option value="pc">PC</option>
    <option value="playstation">PlayStation</option>
    <option value="xbox">Xbox</option>
    <option value="switch">Nintendo Switch</option>
  </select>
</div>

<!-- Games Grid -->
<div id="gamesContainer"></div>

<!-- Pagination Container -->
<div id="paginationContainer" class="pagination flex justify-center gap-4 mt-6"></div>

      <div id="genrePanel" class="genre-panel hidden"></div>

      <div id="loading" class="loading hidden">
        <div class="spinner"></div>
        <p>Searching for games...</p>
      </div>

      <div id="error" class="error hidden"></div>

      <section>
        <div class="results-header">
          <h2 id="resultsTitle">Popular Games</h2>
          <span id="resultCount"></span>
        </div>
        <div id="gamesContainer" class="games-grid"></div>
      </section>
    </main>

    <footer>
      <p>GameFinder &copy; 2026</p>
      <p>Game data powered by <a href="https://gamebrain.co/" target="_blank" rel="noopener">GameBrain</a></p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
